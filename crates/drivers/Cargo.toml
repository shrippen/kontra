[package]
name = "kontra-drivers"
description = "Raw I/O for Kontra: audio devices (cpal), audio file decoding and writing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
# Plugin lists between the scan and its probe processes (MIT/Apache-2.0; already in the tree).
serde.workspace = true
serde_json.workspace = true
# Parameter changes to the audio thread of a plugin without a lock (MIT/Apache-2.0; as in engine).
rtrb.workspace = true
# Audio devices: PipeWire natively when it runs (nodes by name, latency as quantum), else ALSA.
cpal = { version = "0.18", features = ["pipewire"] }
# Decoders, all permissive: WAV (Apache-2.0), FLAC (Apache-2.0), Ogg Vorbis (MIT/Apache-2.0), MP3 (MIT, CC0 core).
hound = "3.5"
claxon = "0.4"
lewton = "0.10"
minimp3 = "0.6"
# MIDI input (LH-EIN-12): ALSA sequencer through the same alsa bindings as cpal (MIT).
midir = "0.11"
# MIDI files as recorded input for QA journeys (Unlicense; content uses it for import).
midly = { version = "0.5.3", default-features = false, features = ["std"] }
# HTTPS for the Songsterr search (LH-BIB-11, round 12; MIT/Apache-2.0): rustls with ring,
# the system's certificates through rustls-platform-verifier (webpki-roots is CDLA, not allowed).
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
# The system's root certificates for the Songsterr search; ureq's platform verifier pulls in
# webpki-root-certs (CDLA-Permissive-2.0, not allowed by deny.toml).
rustls-native-certs = "0.8"
# CLAP plugin hosting (FX2; MIT/Apache-2.0): loading, processing; the extensions are separate crates.
clack-host = "0.2"
# VST3 hosting (FX3; MIT/Apache-2.0): bindings of the MIT-licensed VST3 SDK and COM helpers.
vst3 = "0.3"
# Opens plugin files at runtime (ISC; already in the tree under clack-host, same version).
libloading = "0.8"
# CLAP params, state, latency, audio-ports, gui, timer and posix-fd extensions for the host side (MIT/Apache-2.0).
clack-extensions = { version = "0.2", features = ["clack-host", "params", "state", "latency", "audio-ports", "gui", "timer", "posix-fd"] }

# alsa-lib's own error print, silenced while probing devices (MIT; already in the tree under
# cpal and midir, same version).
[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.4"
# The window of a plugin's own editor (FX5; MIT/Apache-2.0): X11 through its pure Rust
# connection, so no libxcb; also works under XWayland.
x11rb = "0.13"
# prctl(PR_SET_PDEATHSIG) for the stem separator: Demucs ends with Kontra, also after a crash
# (MIT/Apache-2.0; already in the tree under cpal, same version).
libc = "0.2"
# The PipeWire graph for the device lists: node classes and the system defaults (MIT; already
# in the tree under cpal, same version; builds against the system libpipewire, MIT).
pipewire = "0.10"

[features]
# ASIO devices under Windows (LH-NF-17, Win2). The Steinberg SDK it builds against is GPLv3:
# only the Windows package switches this on (agent.md, owner, round 18); every other build
# stays without it.
asio = ["cpal/asio"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# Job objects: the separator's program ends with Kontra (MIT/Apache-2.0; already in the tree
# under cpal's dependencies, same version).
# The window of a plugin's own editor (FX5): Win32 windows and their messages.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
