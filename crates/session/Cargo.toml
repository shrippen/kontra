[package]
name = "kontra-session"
description = "Practice session logic: transport, modes, scoring, summary, progress."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kontra-model.workspace = true
kontra-engine.workspace = true
# "schema" always on: the LLM piece-plan prompt (LH-BIB-16) embeds the PiecePlan JSON Schema at
# runtime, in every build, not only `kontra-cli schemas` (which kept the feature optional below).
kontra-content = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Kept for `kontra-cli`'s own Cargo.toml, which still asks for it by name; a no-op now that
# "schema" is always on above.
schema = ["kontra-content/schema"]

[dev-dependencies]
# Renders bass lines for tests that listen like the app (the reacting band, LH-WIE-05).
kontra-dsp.workspace = true

[lints]
workspace = true
