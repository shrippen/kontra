[package]
name = "kontra-dsp"
description = "Pure signal processing for Kontra: pitch (YIN), onsets, note tracking, filters, test synthesis. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kontra-model.workspace = true
rustfft.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Benches of the real-time path (E4; MIT/Apache-2.0): statistics without plots or rayon.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "realtime"
harness = false
