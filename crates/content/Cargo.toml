[package]
name = "kontra-content"
description = "Imports Guitar Pro, MIDI and MusicXML into arrangements; generates tabs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kontra-model.workspace = true
thiserror.workspace = true
# Package manifest (.kontra, LH-BIB-07).
serde.workspace = true
serde_json.workspace = true
# MIDI files (Unlicense); rayon-based `parallel` feature off.
midly = { version = "0.5.3", default-features = false, features = ["std"] }
# XML tokenizer (MIT).
quick-xml = "0.42"
# Zip archives (MIT; owner, Runde 14): deflate only, through flate2 on miniz_oxide (MIT/Apache-2.0).
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
