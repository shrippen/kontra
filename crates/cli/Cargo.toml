[package]
name = "kontra-cli"
description = "Command line for Kontra: import, analyze, score, corpus checks, tuner and practice without the GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kontra-cli"
path = "src/main.rs"

[dependencies]
kontra-model.workspace = true
kontra-session.workspace = true
serde_json.workspace = true
# Argument parsing (MIT/Apache-2.0).
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
