name: flatpak

# Builds the Flatpak on GitHub, not on Gitea: flatpak-builder needs user namespaces, which the
# Gitea runner's job containers do not allow. Gitea ignores this directory (.gitea/workflows
# exists). Runs on main and by hand; a full build takes about 20 minutes (the KDE SDK is cached).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    if: github.server_url == 'https://github.com'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq flatpak flatpak-builder librsvg2-common curl build-essential
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-kde-6.10-rust-25.08-llvm20
      - name: Sandbox check
        # flatpak-builder needs user namespaces; Ubuntu 24.04 restricts them through AppArmor.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if ! unshare --user --map-root-user true; then
            echo "::error::no user namespaces for flatpak-builder"
            exit 1
          fi
      - name: Build, bundle, smoke test
        run: scripts/flatpak.sh flatpak-out
      - uses: actions/upload-artifact@v4
        with:
          name: kontra-flatpak
          path: |
            flatpak-out/kontra.flatpak
            flatpak-out/flatpak-library.png
