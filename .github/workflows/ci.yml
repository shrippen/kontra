name: ci

# Public mirror: Gitea pushes every branch here on each commit. This runs the checks and reports
# the result back to the commit on Gitea as the status "github / test", where the pull requests
# live. There are no pull requests on GitHub, so everything runs on push. Gitea runs only
# PR-Agent (.gitea/workflows/pr-agent.yml).
#
# Stays local: flow tests in a real window with a bass (Xvfb, QA.md), the owner's interface.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the repository (commit
# statuses).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# No concurrency group: every commit runs to the end and keeps its own status.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/Kontra/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  pending:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

  core:
    # Everything below the GUI: no Qt needed.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config curl build-essential
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        # Without the cache the job only takes longer.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny
            target
          key: core-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - name: Design tokens only (LH-NF-10)
        run: scripts/check-design.sh
      - run: cargo clippy --workspace --exclude kontra-app --all-targets -- -D warnings
      # Includes the journey tests (tests/journeys, QA.md ⚙): recordings rendered on the fly,
      # played in real time through the app core without a sound card.
      - run: cargo test --workspace --exclude kontra-app
      - run: command -v cargo-deny || cargo install --locked cargo-deny
      - run: cargo deny check licenses bans sources
      - name: Licence list in the program is current (LH-NF-11)
        run: python3 scripts/licences.py --check
      - name: Bundled exercises are up to date (LH-BIB-08)
        run: |
          rm -rf /tmp/exercises
          cargo run -q -p kontra-cli --release -- exercises /tmp/exercises > /dev/null
          diff -r /tmp/exercises testdata/exercises --exclude README.md
      - name: Corpus quality (LH-NF-02/03)
        run: cargo run -q -p kontra-cli --release -- korpus check
      # Real recordings as a regression guard (testdata/korpus/QUELLEN.md): IDMT-SMT-Bass-Single-Track,
      # 17 electric-bass lines, released for this use by the owner. Audio is never committed.
      - uses: actions/cache@v4
        # Without the cache the job only takes longer.
        continue-on-error: true
        with:
          path: testdata/korpus/local/dl/idmt-st
          key: idmt-st-7544099
      - name: Real recordings (IDMT, regression floor)
        run: |
          L=testdata/korpus/local
          if [ ! -d "$L/dl/idmt-st/audio" ]; then
            mkdir -p $L/dl/idmt-st
            curl -sSfL -o $L/dl/idmt-st/st.zip \
              https://zenodo.org/api/records/7544099/files/IDMT-SMT-BASS-SINGLE-TRACKS.zip/content
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
              $L/dl/idmt-st/st.zip $L/dl/idmt-st
            rm $L/dl/idmt-st/st.zip
          fi
          python3 scripts/korpus-import.py idmt-st $L/dl/idmt-st $L/conv/idmt-st > /dev/null
          # Floors 1-2 points under the measured 89.6 % / 79.7 % (pitch-aware, ±80 ms; legato
          # notes found since LH-BEW-06; harmonics count in any octave since 12.10.).
          cargo run -q -p kontra-cli --release -- korpus measure $L/conv/idmt-st \
            --window-ms 80 --pitch --min-recall 88 --min-precision 78
          # Techniques on real slaps, pops and dead notes (LH-BEW-06); reported, no floor yet.
          cargo run -q -p kontra-cli --release -- korpus techniques $L/conv/idmt-st

  app:
    # The Qt app: Qt 6.10 and Kirigami from scripts/setup-qt-env.sh (cached), headless screenshots.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cache restores as the runner user, not root.
      - name: Qt folders
        run: sudo mkdir -p /opt/qt /opt/kf6 /opt/qt-tools && sudo chown "$USER" /opt/qt /opt/kf6 /opt/qt-tools
      - uses: actions/cache@v4
        # Without the cache the job only takes longer.
        continue-on-error: true
        with:
          path: |
            /opt/qt
            /opt/kf6
            /opt/qt-tools
          key: qt-6.10.3-kf-6.30.0
      # The Rust build of the app, as in the core job: without it clippy, the tests and the
      # release build for the screenshots compile everything anew (about 8 min).
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            target
          key: app-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Qt, Kirigami and system libraries
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config curl build-essential
          $SUDO scripts/setup-qt-env.sh
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - name: Build and lint
        run: |
          . scripts/qt-env.sh
          cargo clippy -p kontra-app --all-targets -- -D warnings
          cargo test -p kontra-app
      - name: Screenshots
        run: scripts/screenshots.sh shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

  # Also runs when a check failed or was cancelled, so Gitea never keeps a stale "pending".
  report:
    needs: [pending, core, app]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          all="$CORE $APP"
          if [ "$all" = "success success" ]; then
            state=success
          elif echo "$all" | grep -qw failure; then
            state=failure
          else
            state=error
          fi
          desc="core $CORE, app $APP"
          if [ -n "$STARTED" ]; then desc="$desc in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          CORE: ${{ needs.core.result }}
          APP: ${{ needs.app.result }}
          STARTED: ${{ needs.pending.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
