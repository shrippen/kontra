name: ci

# Public mirror: Gitea pushes every branch here on each commit. This runs the checks and reports
# the result back to the commit on Gitea as the status "github / test", where the pull requests
# live. There are no pull requests on GitHub, so everything runs on push. Gitea runs only
# PR-Agent (.gitea/workflows/pr-agent.yml).
#
# Stays local: flow tests in a real window with a bass (Xvfb, planung/QA.md), the owner's interface.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the repository (commit
# statuses).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# No concurrency group: every commit runs to the end and keeps its own status.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/Kontra/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  pending:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

  core:
    # Everything below the GUI: no Qt needed.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit message check needs the pushed range and main.
          fetch-depth: 0
      - name: Commit messages of the push (agent.md rules 1-6, W4)
        run: |
          python3 scripts/commit-msg.py --self-test
          git fetch -q origin main || true
          base="${{ github.event.before }}"
          # A new branch, a force push or a manual run: what is not on main yet.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main HEAD)
          fi
          python3 scripts/commit-msg.py --range "$base..HEAD"
      - name: System libraries
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config curl build-essential appstream desktop-file-utils
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        # Without the cache the job only takes longer.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny
            target
          key: core-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - name: Design tokens only (LH-NF-10)
        run: scripts/check-design.sh
      - run: cargo clippy --workspace --exclude kontra-app --all-targets -- -D warnings
      # Includes the journey tests (tests/journeys, planung/QA.md ⚙): recordings rendered on the fly,
      # played in real time through the app core without a sound card.
      - run: cargo test --workspace --exclude kontra-app
      # Built, not run: timings on shared runners are noise (E4, run locally with `cargo bench`).
      - name: Benches build
        run: cargo bench -p kontra-dsp --no-run
      - run: command -v cargo-deny || cargo install --locked cargo-deny
      - run: cargo deny check licenses bans sources
      - name: Licence list in the program is current (LH-NF-11)
        run: python3 scripts/licences.py --check
      - name: Bundled exercises are up to date (LH-BIB-08)
        run: |
          rm -rf /tmp/exercises
          cargo run -q -p kontra-cli --release -- exercises /tmp/exercises > /dev/null
          diff -r /tmp/exercises testdata/exercises --exclude README.md
      - name: JSON Schemas are up to date (W8)
        run: |
          rm -rf /tmp/schema
          cargo run -q -p kontra-cli --release -- schemas /tmp/schema > /dev/null
          diff -r /tmp/schema schema
      - name: Release tooling and packaging lint (W6)
        run: |
          scripts/release-notes.sh --check
          scripts/release.test.sh
          scripts/lint-packaging.sh
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Corpus quality (LH-NF-02/03)
        run: cargo run -q -p kontra-cli --release -- korpus check
      # Real recordings as a regression guard (testdata/korpus/QUELLEN.md): IDMT-SMT-Bass-Single-Track,
      # 17 electric-bass lines, released for this use by the owner. Audio is never committed.
      - uses: actions/cache@v4
        # Without the cache the job only takes longer.
        continue-on-error: true
        with:
          path: testdata/korpus/local/dl/idmt-st
          key: idmt-st-7544099
      - name: Real recordings (IDMT, regression floor)
        run: |
          L=testdata/korpus/local
          if [ ! -d "$L/dl/idmt-st/audio" ]; then
            mkdir -p $L/dl/idmt-st
            curl -sSfL -o $L/dl/idmt-st/st.zip \
              https://zenodo.org/api/records/7544099/files/IDMT-SMT-BASS-SINGLE-TRACKS.zip/content
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
              $L/dl/idmt-st/st.zip $L/dl/idmt-st
            rm $L/dl/idmt-st/st.zip
          fi
          python3 scripts/korpus-import.py idmt-st $L/dl/idmt-st $L/conv/idmt-st > /dev/null
          # Floors 1-2 points under the measured 89.6 % / 79.7 % (pitch-aware, ±80 ms; legato
          # notes found since LH-BEW-06; harmonics count in any octave since 12.10.).
          cargo run -q -p kontra-cli --release -- korpus measure $L/conv/idmt-st \
            --window-ms 80 --pitch --min-recall 88 --min-precision 78
          # Techniques on real slaps, pops and dead notes (LH-BEW-06); reported, no floor yet.
          cargo run -q -p kontra-cli --release -- korpus techniques $L/conv/idmt-st

  windows:
    # Win1 (LH-NF-17): everything below the GUI builds and passes its tests on Windows (MSVC).
    # Counts for "github / test" (owner, round 18, 10.11.2026): a red Windows run blocks a merge.
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - uses: actions/cache@v4
        # Without the cache the job only takes longer.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --exclude kontra-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude kontra-app --no-fail-fast

  windows-app:
    # Win3 and Win5 (LH-NF-17): the Qt app builds and starts on Windows: Qt and Kirigami from
    # scripts/setup-qt-windows.sh (cached). Counts for "github / test" like `windows`; what
    # blocks a merge: the build, the app's tests, the headless screenshot and the portable
    # folder (missing DLLs, start with a bare PATH). The steps with continue-on-error do not.
    timeout-minutes: 90
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        # Without the cache the job only takes longer.
        continue-on-error: true
        with:
          path: |
            C:/Qt
            C:/kf6
          key: qt-windows-6.10.3-kf-6.30.0-multimedia
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-app-${{ hashFiles('Cargo.lock') }}
      - name: Qt and Kirigami
        run: scripts/setup-qt-windows.sh
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build and test
        run: |
          . scripts/qt-env-windows.sh
          cargo build -p kontra-app
          cargo test -p kontra-app
      - name: Screenshot
        run: |
          . scripts/qt-env-windows.sh
          mkdir -p shots
          KONTRA_DATA_DIR="$RUNNER_TEMP/kontra-data" timeout 120 target/debug/kontra.exe \
            --language en --page settings --screenshot shots/settings-en.png --screenshot-after 2000
          test -f shots/settings-en.png
      # With Windows' own platform plugin (fonts, scaling as a user sees them); the runner's
      # session may refuse a window, so this one may fail.
      - name: Screenshot in a real window
        continue-on-error: true
        run: |
          . scripts/qt-env-windows.sh
          KONTRA_DATA_DIR="$RUNNER_TEMP/kontra-data" QT_QPA_PLATFORM=windows timeout 120 target/debug/kontra.exe \
            --language de --page settings --screenshot shots/settings-de-window.png --screenshot-after 3000
          test -f shots/settings-de-window.png
      # Every page as scripts/screenshots.sh takes them on Linux, in real windows. For looking
      # at, not a check yet: a page that does not come up does not fail the job.
      - name: Screenshots of every page
        continue-on-error: true
        run: QT_QPA_PLATFORM=windows scripts/screenshots.sh shots/pages
      # Win5: the folder the installer will wrap. It must run without the Qt of this job: a
      # screenshot with a bare PATH proves it, in a real window as a user starts it (the folder
      # has Windows' platform plugin only, and the style Kontra picks itself). Uploaded for the
      # test machine, not released.
      - name: Portable folder
        run: |
          scripts/package-windows.sh dist/Kontra
          # What the packed program would not find with a bare PATH (a missing DLL only shows
          # a dialog and hangs).
          missing=$(PATH="/c/Windows/System32:/c/Windows:/usr/bin" /usr/bin/ldd dist/Kontra/bin/kontra.exe dist/Kontra/bin/*.dll | grep -i "not found" | sort -u || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          # Up to three starts: the runner's session may refuse a window once, and this step
          # blocks merges. A start counts only when Kontra ends well and left its picture (a
          # crash or a hang after the picture is still a failure).
          started=no
          for try in 1 2 3; do
            rm -f shots/portable-de.png
            if env -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u QT_PLUGIN_PATH -u QMAKE -u CMAKE_PREFIX_PATH \
              PATH="/c/Windows/System32:/c/Windows:/usr/bin" QT_QPA_PLATFORM=windows \
              QT_FORCE_STDERR_LOGGING=1 KONTRA_DATA_DIR="$RUNNER_TEMP/kontra-portable" \
              /usr/bin/timeout 90 dist/Kontra/bin/kontra.exe --language de --page settings \
              --screenshot shots/portable-de.png --screenshot-after 2000 \
              && [ -f shots/portable-de.png ]; then
              started=yes
              break
            fi
            echo "start $try failed"
          done
          [ "$started" = yes ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: Kontra-windows-portable
          path: dist/Kontra/
          retention-days: 14

  app:
    # The Qt app: Qt 6.10 and Kirigami from scripts/setup-qt-env.sh (cached), headless screenshots.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cache restores as the runner user, not root.
      - name: Qt folders
        run: sudo mkdir -p /opt/qt /opt/kf6 /opt/qt-tools && sudo chown "$USER" /opt/qt /opt/kf6 /opt/qt-tools
      - uses: actions/cache@v4
        # Without the cache the job only takes longer.
        continue-on-error: true
        with:
          path: |
            /opt/qt
            /opt/kf6
            /opt/qt-tools
          key: qt-6.10.3-kf-6.30.0-multimedia
      # The Rust build of the app, as in the core job: without it clippy, the tests and the
      # release build for the screenshots compile everything anew (about 8 min).
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            target
          key: app-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Qt, Kirigami and system libraries
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config curl build-essential
          $SUDO scripts/setup-qt-env.sh
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - name: Build and lint
        run: |
          . scripts/qt-env.sh
          cargo clippy -p kontra-app --all-targets -- -D warnings
          cargo test -p kontra-app
      - name: Course video player (LH-LRN-14)
        run: |
          . scripts/qt-env.sh
          scripts/check-video.sh
      - name: Screenshots
        run: scripts/screenshots.sh shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

  # Also runs when a check failed or was cancelled, so Gitea never keeps a stale "pending".
  report:
    needs: [pending, core, app, windows, windows-app]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          all="$CORE $APP $WINDOWS $WINDOWS_APP"
          if [ "$all" = "success success success success" ]; then
            state=success
          elif echo "$all" | grep -qw failure; then
            state=failure
          else
            state=error
          fi
          desc="core $CORE, app $APP, windows $WINDOWS, windows-app $WINDOWS_APP"
          if [ -n "$STARTED" ]; then desc="$desc in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          # Retried: a lost result would leave "pending" and the merge waiting.
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          CORE: ${{ needs.core.result }}
          APP: ${{ needs.app.result }}
          WINDOWS: ${{ needs.windows.result }}
          WINDOWS_APP: ${{ needs.windows-app.result }}
          STARTED: ${{ needs.pending.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
