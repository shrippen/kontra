# Flatpak manifest (LH-NF-12). Build and check with scripts/flatpak.sh (also in CI): it vendors the
# crates (`cargo vendor`, the build has no network), builds, exports a bundle and starts the app
# headless once.
id: org.shrippen.Kontra
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: kontra
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio through PipeWire/PulseAudio (ALSA in the runtime routes there). No home access:
  # files are opened through the portal file dialog.
  - --socket=pulseaudio
  # Songsterr search on request (LH-BIB-11, round 12); "New in Downloads" reads the download
  # folder, nothing else of the home folder.
  - --share=network
  - --filesystem=xdg-download:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/kontra/cargo
    CARGO_NET_OFFLINE: "true"
modules:
  - name: kontra
    buildsystem: simple
    build-commands:
      - mkdir -p .cargo && cp packaging/cargo-vendor.toml .cargo/config.toml
      - cargo --offline build --release -p kontra-app
      - install -Dm755 target/release/kontra /app/bin/kontra
      - mkdir -p /app/share/kontra/qml /app/share/kontra/demo
      - cp -r crates/app/qml/Kante /app/share/kontra/qml/Kante
      - install -Dm644 testdata/demo/etude-1.mid /app/share/kontra/demo/etude-1.mid
      - cp -r testdata/exercises /app/share/kontra/exercises
      - rm /app/share/kontra/exercises/README.md
      - install -Dm644 packaging/org.shrippen.Kontra.desktop /app/share/applications/org.shrippen.Kontra.desktop
      - install -Dm644 packaging/org.shrippen.Kontra.svg /app/share/icons/hicolor/scalable/apps/org.shrippen.Kontra.svg
      # 16–24 px from the simplified small logo (three lanes), larger sizes from the full one.
      - for n in 16 22 24 32 48 64 128 256; do install -Dm644 packaging/icons/$n.png /app/share/icons/hicolor/${n}x${n}/apps/org.shrippen.Kontra.png; done
      - install -Dm644 packaging/org.shrippen.Kontra.mime.xml /app/share/mime/packages/org.shrippen.Kontra.xml
      - install -Dm644 packaging/org.shrippen.Kontra.metainfo.xml /app/share/metainfo/org.shrippen.Kontra.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - testdata/korpus/local
          - docs
