# Flatpak manifest (LH-NF-12). Build and check with scripts/flatpak.sh (also in CI): it vendors the
# crates (`cargo vendor`, the build has no network), builds, exports a bundle and starts the app
# headless once.
id: io.github.shrippen.Kontra
runtime: org.kde.Platform
# Course videos (LH-LRN-14, Runde 14: WebM and MP4): Qt Multimedia's FFmpeg is in the runtime, the
# patent-encumbered codecs (H.264, AAC) come with its extension org.freedesktop.Platform.codecs-extra,
# which Flatpak installs with it; the successor of ffmpeg-full.
runtime-version: "6.11"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang for the PipeWire bindings (bindgen), build time only.
  - org.freedesktop.Sdk.Extension.llvm20
command: kontra
finish-args:
  - --share=ipc
  - --socket=wayland
  # X11 also under Wayland: a plugin's own window (FX5) is an X11 window (XWayland).
  - --socket=x11
  - --device=dri
  # Audio through PipeWire/PulseAudio (ALSA in the runtime routes there). No home access:
  # files are opened through the portal file dialog.
  - --socket=pulseaudio
  # PipeWire directly: interfaces by name and a small quantum (LH-EIN-02, LH-NF-01); without
  # the socket Kontra falls back to ALSA.
  - --filesystem=xdg-run/pipewire-0
  # Songsterr search on request (LH-BIB-11, round 12); "New in Downloads" reads the download
  # folder, nothing else of the home folder.
  - --share=network
  - --filesystem=xdg-download:ro
  # Plugins the player installed for their user (FX6, Runde 20); system plugins under /usr are
  # not visible in the sandbox: they come as Flatpak extensions (below).
  - --filesystem=~/.clap:ro
  - --filesystem=~/.vst3:ro
  # LLM API keys (LH-BIB-16) in the system's keyring, via the Secret Service portal (owner,
  # 13.11.2026).
  - --talk-name=org.freedesktop.secrets
# CLAP and VST 3 plugins packaged for Flatpak (org.freedesktop.LinuxAudio.Plugins.*), as other
# audio apps take them; Kontra searches /app/extensions/Plugins/{clap,vst3} in the sandbox.
add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: "25.08"
    add-ld-path: lib
    merge-dirs: clap;vst3
    subdirectories: true
    no-autodownload: true
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
    CARGO_HOME: /run/build/kontra/cargo
    CARGO_NET_OFFLINE: "true"
modules:
  - name: kontra
    buildsystem: simple
    build-commands:
      - mkdir -p .cargo && cp packaging/cargo-vendor.toml .cargo/config.toml
      - cargo --offline build --release -p kontra-app
      - install -Dm755 target/release/kontra /app/bin/kontra
      # Mount point of the plugin extensions (add-extensions above).
      - mkdir -p /app/extensions/Plugins
      - mkdir -p /app/share/kontra/qml /app/share/kontra/demo
      - cp -r crates/app/qml/Kante /app/share/kontra/qml/Kante
      - install -Dm644 testdata/demo/etude-1.mid /app/share/kontra/demo/etude-1.mid
      - cp -r testdata/exercises /app/share/kontra/exercises
      - rm /app/share/kontra/exercises/README.md
      - install -Dm644 packaging/io.github.shrippen.Kontra.desktop /app/share/applications/io.github.shrippen.Kontra.desktop
      - install -Dm644 packaging/io.github.shrippen.Kontra.svg /app/share/icons/hicolor/scalable/apps/io.github.shrippen.Kontra.svg
      # 16–24 px from the simplified small logo (three lanes), larger sizes from the full one.
      - for n in 16 22 24 32 48 64 128 256; do install -Dm644 packaging/icons/$n.png /app/share/icons/hicolor/${n}x${n}/apps/io.github.shrippen.Kontra.png; done
      - install -Dm644 packaging/io.github.shrippen.Kontra.mime.xml /app/share/mime/packages/io.github.shrippen.Kontra.xml
      - install -Dm644 packaging/io.github.shrippen.Kontra.metainfo.xml /app/share/metainfo/io.github.shrippen.Kontra.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - testdata/korpus/local
          - docs
