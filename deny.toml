# Licence and source policy (LH-NF-11): only permissive licences; Qt and KDE Frameworks are
# linked dynamically and are not Cargo dependencies. In doubt: build it ourselves.

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Known vulnerabilities (Harmonicon W7): a job of its own in .github/workflows/advisories.yml, on
# main and weekly, so a new advisory does not turn unrelated pull requests red.
[advisories]
ignore = [
    # slice-ring-buffer via minimp3 (MP3 decoding): the double frees need a Clone or Drop of the
    # elements that panics, or one of four functions minimp3 does not call. minimp3 keeps bytes
    # (u8) and only uses `extend` over `&u8` and `truncate_front`. Checked 29.10.2026; drop this
    # when minimp3 or its ring buffer is replaced.
    { id = "RUSTSEC-2025-0044", reason = "minimp3 uses none of the affected paths (u8, extend, truncate_front)" },
]
