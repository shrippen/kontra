name: ci

# Branches are tested through their pull request; main runs on push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    # Everything below the GUI: no Qt needed.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq libasound2-dev pkg-config curl build-essential
      - name: Rust
        run: |
          # The runner image has no rustup: install it (stable, minimal).
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny
            target
          key: core-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude kontra-app --all-targets -- -D warnings
      # Includes the journey tests (tests/journeys, QA.md ⚙): recordings rendered on the fly,
      # played in real time through the app core without a sound card.
      - run: cargo test --workspace --exclude kontra-app
      - run: command -v cargo-deny || cargo install --locked cargo-deny
      - run: cargo deny check licenses bans sources
      - name: Corpus quality (LH-NF-02/03)
        run: cargo run -q -p kontra-cli --release -- korpus check
      # Real recordings as a regression guard (testdata/korpus/QUELLEN.md): IDMT-SMT-Bass-Single-Track,
      # 17 electric-bass lines, released for this use by the owner. Audio is never committed.
      - uses: actions/cache@v4
        with:
          path: testdata/korpus/local/dl/idmt-st
          key: idmt-st-7544099
      - name: Real recordings (IDMT, regression floor)
        run: |
          L=testdata/korpus/local
          if [ ! -d "$L/dl/idmt-st/audio" ]; then
            mkdir -p $L/dl/idmt-st
            curl -sSfL -o $L/dl/idmt-st/st.zip \
              https://zenodo.org/api/records/7544099/files/IDMT-SMT-BASS-SINGLE-TRACKS.zip/content
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
              $L/dl/idmt-st/st.zip $L/dl/idmt-st
            rm $L/dl/idmt-st/st.zip
          fi
          python3 scripts/korpus-import.py idmt-st $L/dl/idmt-st $L/conv/idmt-st > /dev/null
          # Floors 1-2 points under the measured 82.5 % / 78.9 % (pitch-aware, ±80 ms).
          cargo run -q -p kontra-cli --release -- korpus measure $L/conv/idmt-st \
            --window-ms 80 --pitch --min-recall 81 --min-precision 77

  app:
    # The Qt app: Qt 6.10 and Kirigami from scripts/setup-qt-env.sh (cached), headless screenshots.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /opt/qt
            /opt/kf6
            /opt/qt-tools
          key: qt-6.10.3-kf-6.30.0
      - name: Qt, Kirigami and system libraries
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq libasound2-dev pkg-config curl build-essential
          $SUDO scripts/setup-qt-env.sh
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and lint
        run: |
          . scripts/qt-env.sh
          cargo clippy -p kontra-app --all-targets -- -D warnings
          cargo test -p kontra-app
      - name: Screenshots
        run: scripts/screenshots.sh shots
      - uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: shots/
